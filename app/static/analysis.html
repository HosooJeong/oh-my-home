<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>살자리 · 내 생활권</title><link rel="stylesheet" href="/village.css"><link rel="stylesheet" href="/analysis.css"><link rel="stylesheet" href="/result-report.css"><script type="module" src="/analysis.mjs"></script><link rel="preload" href="/vendor/fonts/SUIT-Variable.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/interview.css"><link rel="stylesheet" href="/typography.css"></head>
<body><header class="app-header"><a class="brand" href="/">살자리</a><a class="text-button" href="/">조건 수정</a><a class="text-button" href="/settings">AI 설정</a></header>
<main id="analysis-app" data-phase="loading">
 <section id="journey-stage" class="journey-stage" data-mode="reading" aria-label="내 마을 분석 진행">
  <canvas id="journey-canvas" aria-label="배치한 건물과 분야별 분석 상태"></canvas><div id="journey-labels" class="block-labels" aria-hidden="true"></div>
  <p id="journey-fallback" class="journey-fallback" hidden>3D 화면 연결 오류</p>
  <ol id="journey-categories" class="journey-categories" aria-label="카테고리별 진행 상태"></ol>
 </section>
 <section id="loading-panel" class="loading-panel" aria-live="polite"><h1 id="loading-title">조건 정리 중</h1><p id="loading-detail" class="quiet"></p><button id="cancel-analysis" class="text-button" type="button" hidden>취소</button></section>
 <section id="additional-panel" class="flow-panel" hidden><h1>추가로 말한 조건</h1><form id="additional-form"><div id="additional-groups"></div><p id="additional-shares" class="quiet"></p><button class="primary" type="submit">선택한 조건으로 계속</button></form></section>
 <section id="question-panel" class="flow-panel" hidden><h1>조금 더 알려주세요</h1><div id="criteria-preview"></div><form id="interview-form"><div id="interview-fields"></div><button class="primary" type="submit">답변하고 계속</button></form><button id="review-conditions" class="text-button" type="button" hidden>답변 없이 조건 확인</button></section>
 <section id="review-panel" class="flow-panel" hidden><h1>내 조건 확인</h1><div id="review-groups"></div><details><summary>원래 요청과 남은 확인</summary><div id="review-origin"></div></details><p id="review-error" class="quiet" role="alert" hidden></p><button id="confirm-profile" class="primary" type="button">이 조건으로 분석</button></section>
 <section id="error-panel" class="flow-panel" role="alert" hidden><h1 id="error-title"></h1><p id="error-detail" class="quiet"></p><button id="retry-analysis" class="primary" type="button">다시 시작</button><a class="text-button" href="/">조건 수정</a></section>
 <section id="scope-panel" class="flow-panel" hidden><h1>관심 지역</h1><p id="scope-reason" class="quiet"></p><form id="scope-form"><div class="question-field"><label for="scope-area">관심 지역</label><select id="scope-area"></select></div><button class="primary" type="submit">조사할 지점 선택</button></form></section>
 <section id="report-panel" class="personal-report" hidden aria-label="나의 조건 충족도 보고서">
  <div class="report-heading"><h2>분석 결과</h2><a class="text-button" href="/routes" target="_blank" rel="noopener noreferrer">경로 확인</a><label for="report-candidate">분석할 집<select id="report-candidate"></select></label></div>
  <div class="report-layout"><figure id="report-radar" class="report-radar"></figure><div class="report-reading"><div id="report-tabs" class="report-tabs" role="tablist" aria-label="평가 분야"></div><section id="report-content" class="report-content" role="tabpanel" tabindex="0"></section></div></div>
 </section>
 <section id="map-panel" hidden><div class="result-heading"><div><span id="entry-label" class="eyebrow"></span><h1 id="view-title"></h1><p id="view-note" class="quiet"></p></div><button id="add-comparison" class="text-button" type="button" hidden>주변 비교 추가</button></div><div class="analysis-layout"><div class="map-column"><div class="map-frame"><div id="analysis-map" role="region" aria-label="집과 주변 시설 지도"></div><div id="analysis-map-state" class="map-state" role="status"><p id="map-fallback">지도 로딩 중</p><button id="analysis-map-retry" type="button" hidden>다시 불러오기</button></div></div><div id="place-controls"><form id="place-form"><label class="sr-only" for="place-name">집 이름</label><input id="place-name" maxlength="40" placeholder="집 이름 (선택)"></form><ol id="place-list"></ol><button id="run-comparison" class="primary" type="button" disabled>이 집 분석</button></div><div id="result-scope" class="quiet"></div></div><div id="result-list" class="result-list"></div></div></section>
 <div id="report-supplements" hidden>
 <section id="reference-panel" class="reference-panel" hidden><h2>집·비용 <span class="quiet">참고</span></h2><div id="housing-result"></div></section>
 <section id="research-panel" class="reference-panel" hidden><div class="research-heading"><h2>주변 이야기</h2><button id="cancel-research" class="text-button" type="button" hidden>조사 취소</button></div><p id="research-status" class="quiet" role="status"></p><p id="research-counts" class="quiet"></p><details id="research-request-panel" hidden><summary id="research-request-summary">요청한 조사</summary><div id="research-requests"></div></details><div id="research-results"></div></section>
 </div>
 <output id="analysis-state" hidden></output><output id="journey-state" hidden></output>
</main></body></html>
