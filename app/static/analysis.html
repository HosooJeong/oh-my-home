<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>살자리 · 내 생활권</title><link rel="stylesheet" href="/village.css"><link rel="stylesheet" href="/analysis.css"><script type="module" src="/analysis.mjs"></script></head>
<body><header class="app-header"><a class="brand" href="/">살자리</a><a class="text-button" href="/">조건 수정</a></header>
<main id="analysis-app" data-phase="loading">
 <section id="loading-panel" class="loading-panel" aria-live="polite"><div class="building-loader" aria-hidden="true"><div class="loader-home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7"/></svg></div><i></i><i></i><i></i><i></i><i></i><i></i></div><h1 id="loading-title">내 조건을 정리하고 있어</h1><p id="loading-detail" class="quiet">선택한 분야의 니즈를 읽는 중</p><button id="cancel-analysis" class="text-button" type="button" hidden>취소</button></section>
 <section id="additional-panel" class="flow-panel" hidden><h1>추가로 말한 조건</h1><form id="additional-form"><div id="additional-groups"></div><p id="additional-shares" class="quiet"></p><button class="primary" type="submit">선택한 조건으로 계속</button></form></section>
 <section id="question-panel" class="flow-panel" hidden><h1>이것만 더 알려줘</h1><div id="criteria-preview"></div><form id="interview-form"><div id="interview-fields"></div><button class="primary" type="submit">답변하고 계속</button></form><button id="confirm-profile" class="primary" type="button" hidden>이 조건으로 분석</button></section>
 <section id="error-panel" class="flow-panel" role="alert" hidden><h1 id="error-title"></h1><p id="error-detail" class="quiet"></p><button id="retry-analysis" class="primary" type="button">다시 시작</button><a class="text-button" href="/">조건 수정</a></section>
 <section id="scope-panel" class="flow-panel" hidden><h1>어느 지역부터 알아볼까?</h1><p id="scope-reason" class="quiet"></p><form id="scope-form"><div class="question-field"><label for="scope-area">관심 지역</label><select id="scope-area"></select></div><button class="primary" type="submit">조사할 지점 선택</button></form></section>
 <section id="map-panel" hidden><div class="result-heading"><div><span id="entry-label" class="eyebrow"></span><h1 id="view-title"></h1><p id="view-note" class="quiet"></p></div><button id="add-comparison" class="text-button" type="button" hidden>주변 비교 추가</button></div><div class="analysis-layout"><div class="map-column"><div id="analysis-map" role="region" aria-label="집과 주변 시설 지도"><p id="map-fallback">지도를 준비하고 있어</p></div><div id="place-controls"><form id="place-form"><label for="place-name">집 이름</label><input id="place-name" maxlength="40" placeholder="지도에서 위치를 선택해"><details><summary>좌표로 입력</summary><div class="pair"><label>위도<input id="place-lat" type="number" step="any" min="-90" max="90" placeholder="35.18"></label><label>경도<input id="place-lon" type="number" step="any" min="-180" max="180" placeholder="128.10"></label></div><button type="submit">이 위치 추가</button></details></form><ol id="place-list"></ol><button id="run-comparison" class="primary" type="button" disabled>이 집 분석</button></div><div id="result-scope" class="quiet"></div></div><div id="result-list" class="result-list"></div></div></section>
 <section id="reference-panel" class="reference-panel" hidden><h2>집·비용 <span class="quiet">참고</span></h2><div id="housing-result"></div></section>
 <section id="research-panel" class="reference-panel" hidden><div class="research-heading"><h2>주변 이야기</h2><button id="cancel-research" class="text-button" type="button" hidden>조사 취소</button></div><p id="research-status" class="quiet" role="status"></p><details id="research-request-panel" hidden><summary id="research-request-summary">요청한 조사</summary><div id="research-requests"></div></details><div id="research-results"></div></section>
 <output id="analysis-state" hidden></output>
</main></body></html>
