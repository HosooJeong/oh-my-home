<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f1e9"><title>주거 의사결정 AI Agent (oh-my-home)</title><link rel="stylesheet" href="/village.css"><script type="module" src="/village.mjs"></script><link rel="preload" href="/vendor/fonts/SUIT-Variable.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/typography.css"></head>
<body class="village-page">
<header class="app-header"><a class="brand" href="/" aria-label="주거 의사결정 AI Agent oh-my-home"><span class="brand-title">주거 의사결정 AI Agent</span><span class="brand-subtitle">oh-my-home</span></a><button id="change-start" class="icon-button" type="button" aria-label="시작 화면으로" data-icon="home" hidden></button><a class="text-button" href="/settings">AI 설정</a></header>
<main id="village-app" data-mode="start">
 <section id="scene-wrap" class="scene-wrap" aria-label="나의 생활 마을">
  <canvas id="village-canvas" aria-label="블록을 끌어 놓으면 집과의 거리로 중요도가 바뀌는 3D 마을"></canvas><div id="block-labels" class="block-labels" aria-hidden="true"></div>
  <div class="scene-heading"><h1>중요한 것을, 집 가까이.</h1></div>
  <div id="scene-controls" class="scene-controls" hidden><button id="turn-left" class="icon-button" type="button" aria-label="마을 왼쪽으로 회전" data-icon="rotate-left"></button><button id="turn-right" class="icon-button" type="button" aria-label="마을 오른쪽으로 회전" data-icon="rotate-right"></button><button id="zoom-in" class="icon-button" type="button" aria-label="마을 확대" data-icon="zoom-in"></button><button id="zoom-out" class="icon-button" type="button" aria-label="마을 축소" data-icon="zoom-out"></button></div>
  <div id="fallback-note" class="fallback-note" hidden>3D 화면을 불러오지 못했어요. 새로고침해 주세요.</div>
  <section id="entry-panel" class="floating-panel entry-panel"><h2>어떻게 시작할까요?</h2><button type="button" data-entry="discover"><span class="entry-symbol" data-icon="search"></span><span>주소 없이 찾아보기</span><span data-icon="arrow-right"></span></button><button type="button" data-entry="single"><span class="entry-symbol" data-icon="home"></span><span>집 한 곳 분석</span><span data-icon="arrow-right"></span></button><button type="button" data-entry="multiple"><span class="entry-symbol" data-icon="houses"></span><span>여러 집 비교</span><span data-icon="arrow-right"></span></button></section>
 </section>
 <section id="location-panel" class="entry-location" hidden>
  <button id="location-back" class="text-button" type="button"><span data-icon="arrow-left"></span>이전</button><h1 id="location-title">집 선택</h1>
  <div id="discover-location"><label class="sr-only" for="location-input">관심 지역</label><input id="location-input" maxlength="200" placeholder="예: 진주 전체, 평거동"></div>
  <div id="known-location" class="entry-location-grid" hidden>
   <div class="entry-location-search"><form id="address-form"><label class="sr-only" for="address-input">주소 검색</label><div class="address-search-row"><input id="address-input" maxlength="200" placeholder="주소 검색" autocomplete="street-address"><button id="address-search" type="submit" aria-label="주소 검색" data-icon="search"></button></div></form><p id="address-status" class="location-note" role="status"></p><div id="address-results"></div><div id="map-pick" hidden><p id="map-pick-label"></p><button id="confirm-map-pick" type="button">이 위치 선택</button></div><ol id="entry-place-list" aria-label="선택한 집"></ol><p id="entry-place-count" class="location-note"></p></div>
   <div class="map-frame"><div id="entry-map" role="region" aria-label="분석할 집 위치 선택 지도"></div><div id="entry-map-state" class="map-state" role="status"><p id="entry-map-fallback">지도 로딩 중</p><button id="entry-map-retry" type="button" hidden>다시 불러오기</button></div></div>
  </div>
  <p id="location-error" class="location-note" role="alert" hidden></p><button id="enter-town" class="primary" type="button">다음<span data-icon="arrow-right"></span></button>
 </section>
 <section id="town-tools" class="town-tools" hidden>
  <div id="category-tray" class="category-tray" aria-label="고려할 카테고리 선택"></div>
  <button id="open-details" class="primary" type="button" disabled>배치 완료<span data-icon="arrow-right"></span></button>
 </section>
 <section id="detail-panel" class="detail-panel" aria-label="상세 조건 입력" hidden>
  <div class="detail-top"><button id="back-town" class="text-button" type="button"><span data-icon="arrow-left"></span>배치로 돌아가기</button><span id="question-progress"></span></div>
  <div id="question-view"><div class="question-category"><span class="category-mark" id="question-mark"></span><span id="question-category"></span></div><h1><label id="question-label" for="category-answer"></label></h1><div id="question-examples" class="question-examples" role="group" hidden></div><textarea id="category-answer" rows="5" maxlength="450"></textarea><p id="question-sample-status" class="question-sample-status" role="status" aria-live="polite"></p><div class="question-actions"><button id="question-prev" class="icon-button" type="button" aria-label="이전 질문" data-icon="arrow-left"></button><button id="question-next" class="primary" type="button"><span id="question-next-label">다음</span><span data-icon="arrow-right"></span></button></div><button id="question-unknown" class="text-button" type="button">나중에 정할게요</button></div>
  <div id="review-view" hidden><h1>내 조건</h1><div id="answer-summary"></div><details><summary>추가 참고</summary><label class="sr-only" for="extra-request">추가로 확인할 내용</label><textarea id="extra-request" rows="3" maxlength="300" placeholder="예: 주변 전세 실거래가나 야간 보행 환경도 참고하고 싶어요."></textarea></details><p id="review-note" class="location-note" role="status"></p><button id="continue-workspace" class="primary" type="button">분석 시작<span data-icon="arrow-right"></span></button></div>
 </section>
 <div id="village-status" class="village-status sr-only" role="status" aria-live="polite"></div><output id="scene-state" hidden></output>
</main>
</body></html>
