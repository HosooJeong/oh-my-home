<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f1e9"><title>살자리</title><link rel="stylesheet" href="/village.css"><script type="module" src="/village.mjs"></script></head>
<body class="village-page">
<header class="app-header"><a class="brand" href="/">살자리</a><button id="change-start" class="icon-button" type="button" aria-label="시작 화면으로" data-icon="home" hidden></button></header>
<main id="village-app" data-mode="start">
 <section id="scene-wrap" class="scene-wrap" aria-label="나의 생활 마을">
  <canvas id="village-canvas" aria-label="블록을 끌어 놓으면 집과의 거리로 중요도가 바뀌는 3D 마을"></canvas><div id="block-labels" class="block-labels" aria-hidden="true"></div>
  <div class="scene-heading"><h1>중요한 것을, 집 가까이.</h1></div>
  <div id="scene-controls" class="scene-controls" hidden><button id="turn-left" class="icon-button" type="button" aria-label="마을 왼쪽으로 회전" data-icon="rotate-left"></button><button id="turn-right" class="icon-button" type="button" aria-label="마을 오른쪽으로 회전" data-icon="rotate-right"></button><button id="zoom-in" class="icon-button" type="button" aria-label="마을 확대" data-icon="zoom-in"></button><button id="zoom-out" class="icon-button" type="button" aria-label="마을 축소" data-icon="zoom-out"></button></div>
  <div id="fallback-note" class="fallback-note" hidden>3D 화면을 사용할 수 없어. 화면을 새로고침하거나 다른 브라우저에서 열어봐.</div>
  <section id="entry-panel" class="floating-panel entry-panel"><h2>어디서 시작할까?</h2><button type="button" data-entry="discover"><span class="entry-symbol" data-icon="search"></span><span>주소 없이 찾아보기</span><span data-icon="arrow-right"></span></button><button type="button" data-entry="single"><span class="entry-symbol" data-icon="home"></span><span>집 한 곳 분석</span><span data-icon="arrow-right"></span></button><button type="button" data-entry="multiple"><span class="entry-symbol" data-icon="houses"></span><span>여러 집 비교</span><span data-icon="arrow-right"></span></button></section>
 </section>
 <section id="location-panel" class="entry-location" hidden>
  <button id="location-back" class="text-button" type="button"><span data-icon="arrow-left"></span>이전</button><h1 id="location-title">어느 집을 분석할까?</h1>
  <div id="discover-location"><label for="location-input">찾아볼 생활권</label><input id="location-input" maxlength="200" placeholder="예: 진주 전체, 평거동"></div>
  <div id="known-location" class="entry-location-grid" hidden>
   <div class="entry-location-search"><form id="address-form"><label for="address-input">집 주소</label><div class="address-search-row"><input id="address-input" maxlength="200" placeholder="도로명·지번 주소" autocomplete="street-address"><button id="address-search" type="submit" aria-label="주소 검색" data-icon="search"></button></div></form><p id="address-status" class="location-note" role="status">주소를 검색하거나 지도에서 위치를 골라줘.</p><div id="address-results"></div><div id="map-pick" hidden><p id="map-pick-label"></p><button id="confirm-map-pick" type="button">이 위치 선택</button></div><ol id="entry-place-list" aria-label="선택한 집"></ol><p id="entry-place-count" class="location-note"></p><details id="entry-coordinate"><summary>지도를 사용할 수 없을 때</summary><form id="coordinate-form"><label for="coordinate-name">집 이름·주소</label><input id="coordinate-name" maxlength="200"><div class="coordinate-row"><label>위도<input id="coordinate-lat" type="number" step="any" min="-90" max="90" required></label><label>경도<input id="coordinate-lon" type="number" step="any" min="-180" max="180" required></label></div><button type="submit">이 위치 선택</button></form></details></div>
   <div id="entry-map" role="region" aria-label="분석할 집 위치 선택 지도"><p id="entry-map-fallback">지도를 준비하고 있어</p></div>
  </div>
  <p id="location-error" class="location-note" role="alert" hidden></p><button id="enter-town" class="primary" type="button">이 집으로 마을 만들기<span data-icon="arrow-right"></span></button>
 </section>
 <section id="town-tools" class="town-tools" hidden>
  <div id="category-tray" class="category-tray" aria-label="고려할 카테고리 선택"></div>
  <button id="open-details" class="primary" type="button" disabled>배치 완료<span data-icon="arrow-right"></span></button>
 </section>
 <section id="detail-panel" class="detail-panel" aria-label="상세 조건 입력" hidden>
  <div class="detail-top"><button id="back-town" class="text-button" type="button"><span data-icon="arrow-left"></span>배치로 돌아가기</button><span id="question-progress"></span></div>
  <div id="question-view"><div class="question-category"><span class="category-mark" id="question-mark"></span><span id="question-category"></span></div><h1><label id="question-label" for="category-answer"></label></h1><textarea id="category-answer" rows="5" maxlength="450"></textarea><div class="question-actions"><button id="question-prev" class="icon-button" type="button" aria-label="이전 질문" data-icon="arrow-left"></button><button id="question-next" class="primary" type="button"><span id="question-next-label">다음</span><span data-icon="arrow-right"></span></button></div><button id="question-unknown" class="text-button" type="button">아직 모르겠어</button></div>
  <div id="review-view" hidden><h1>내 조건</h1><div id="answer-summary"></div><button id="continue-workspace" class="primary" type="button">분석 시작<span data-icon="arrow-right"></span></button></div>
 </section>
 <div id="village-status" class="village-status sr-only" role="status" aria-live="polite"></div><output id="scene-state" hidden></output>
</main>
</body></html>
